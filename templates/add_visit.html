{% include 'header.html' %}
{% load static %}

<div class="container mt-5 pt-5 fade-in">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="glass-card shadow-lg">
                <div class="text-center mb-4">
                    <div class="d-inline-block p-3 rounded-circle mb-3" style="background: rgba(14, 165, 233, 0.05); border: 1px solid rgba(14, 165, 233, 0.1);">
                        <i class="icon-users text-info" style="font-size: 2.5rem;"></i>
                    </div>
                    <h2 class="text-gradient font-weight-bold">Visit Logger</h2>
                    <p class="text-muted small">Record external visits and guest interactions for safety and monitoring.</p>
                </div>

                <form method="POST" class="modern-form">
                    {% csrf_token %}
                    
                    <div class="form-group mb-4">
                        <label class="text-muted small font-weight-bold text-uppercase">Visitor Name</label>
                        <input type="text" name="visitor_name" class="form-control text-main font-weight-bold" style="height: 50px;" placeholder="Full name of the visitor" required>
                    </div>

                    <div class="form-group mb-5">
                        <label class="text-muted small font-weight-bold text-uppercase">Visit Details</label>
                        <textarea name="visit_note" class="form-control text-main font-weight-bold" rows="5" placeholder="Purpose of visit, duration, etc..." required></textarea>
                    </div>

                    <button type="submit" class="modern-btn btn-block py-3">
                        <i class="icon-save mr-2"></i> Log Visit
                    </button>
                    <a href="javascript:history.back()" class="btn btn-link btn-block text-muted font-weight-bold small mt-3">Go Back</a>
                </form>
            </div>
        </div>
    </div>
</div>

<br><br>
{% include 'footer.html' %}
