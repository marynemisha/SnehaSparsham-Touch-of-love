{% include 'header.html' %}
{% load static %}

<div class="container mt-5 pt-5 fade-in">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="glass-card shadow-lg">
                <div class="text-center mb-4">
                    <div class="d-inline-block p-3 rounded-circle mb-3" style="background: rgba(16, 185, 129, 0.05); border: 1px solid rgba(16, 185, 129, 0.1);">
                        <i class="icon-medkit text-success" style="font-size: 2.5rem;"></i>
                    </div>
                    <h2 class="text-gradient font-weight-bold">Add Medicine</h2>
                    <p class="text-muted small">Schedule new medication for a senior citizen.</p>
                </div>

                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-success bg-white border-success text-success small mb-4 shadow-sm" style="border-radius: 12px;">
                            <i class="icon-check-circle mr-2"></i> {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}

                <form method="POST" class="modern-form">
                    {% csrf_token %}

                    <div class="form-group mb-4">
                        <label class="text-muted small font-weight-bold text-uppercase" style="letter-spacing: 1px;">Senior Citizen</label>
                        <select name="senior" class="form-control text-main font-weight-bold" style="height: 50px;" required>
                            <option value="" class="bg-white">Select Senior</option>
                            {% for s in seniors %}
                                <option value="{{ s.id }}" class="bg-white">{{ s.fullname }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-group mb-4">
                        <label class="text-muted small font-weight-bold text-uppercase" style="letter-spacing: 1px;">Medicine Name</label>
                        <input type="text" name="medicine_name" class="form-control text-main font-weight-bold" style="height: 50px;" placeholder="e.g. Paracetamol" required>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group mb-4">
                                <label class="text-muted small font-weight-bold text-uppercase" style="letter-spacing: 1px;">Dosage</label>
                                <input type="text" name="dosage" class="form-control text-main font-weight-bold" style="height: 50px;" placeholder="e.g. 500mg" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group mb-4">
                                <label class="text-muted small font-weight-bold text-uppercase" style="letter-spacing: 1px;">Time</label>
                                <input type="time" name="time" class="form-control text-main font-weight-bold" style="height: 50px;" required>
                            </div>
                        </div>
                    </div>

                    <div class="form-group mb-5">
                        <label class="text-muted small font-weight-bold text-uppercase" style="letter-spacing: 1px;">Notes (Optional)</label>
                        <textarea name="notes" class="form-control text-main font-weight-bold" rows="3" placeholder="Special instructions..."></textarea>
                    </div>

                    <button type="submit" class="modern-btn btn-block py-3">
                        <i class="icon-plus-circle mr-2"></i> Save Schedule
                    </button>
                    <a href="{% url 'admin_dashboard' %}" class="btn btn-link btn-block text-muted font-weight-bold small mt-3">Cancel and Return</a>

                </form>
            </div>
        </div>
    </div>
</div>

<br><br>
{% include 'footer.html' %}
