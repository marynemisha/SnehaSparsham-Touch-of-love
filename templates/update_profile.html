<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Profile Picture</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 400px;
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
        }

        /* Preview image */
        #previewimg {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid #ddd;
            display: none;
            margin: 15px auto;
        }

        /* Hide original file input */
        input[type="file"] {
            display: none;
        }

        /* Custom Choose Photo button */
        .custom-file-btn {
            background-color: #0d9488;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            display: inline-block;
            transition: 0.3s;
            margin-top: 10px;
        }

        .custom-file-btn:hover {
            background-color: #0066d1;
        }

   
        .btn {
            padding: 10px 20px;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 25px;
        }

        .btn:hover {
            background-color: #45a049;
        }
    </style>
</head>

<body>

<div class="card">
    <h2>Update Your Profile Picture</h2>
    
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <label>Select New Profile Picture:</label>

        <img id="previewimg" src="" alt="Image Preview">

        <!-- Custom Choose Button -->
        <label for="profileinp" class="custom-file-btn">Choose Photo</label>
        <input type="file" id="profileinp" name="profile" accept="image/*" onchange="loadPreview(event)" required>

        <button type="submit" class="btn">Update</button>

        <script>
            function loadPreview(event) {
                let image = document.getElementById('previewimg');
                image.src = URL.createObjectURL(event.target.files[0]);
                image.style.display = "block";
            }
        </script>
    </form>
</div>

</body>
</html>
