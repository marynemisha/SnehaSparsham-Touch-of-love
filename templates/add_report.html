{% include 'header.html' %}
{% load static %}

<div class="container mt-5 pt-5 fade-in">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="glass-card shadow-lg">
                <div class="text-center mb-4">
                    <div class="d-inline-block p-3 rounded-circle mb-3" style="background: rgba(14, 165, 233, 0.05); border: 1px solid rgba(14, 165, 233, 0.1);">
                        <i class="icon-file-text text-info" style="font-size: 2.5rem;"></i>
                    </div>
                    <h2 class="text-gradient font-weight-bold">Add New Report</h2>
                    <p class="text-muted small">Submit a detailed care report for administrative review.</p>
                </div>

                <form method="POST" class="modern-form">
                    {% csrf_token %}

                    <div class="form-group mb-4">
                        <label class="text-muted small font-weight-bold text-uppercase" style="letter-spacing: 1px;">Associate Senior Citizen</label>
                        <select name="senior" class="form-control text-main font-weight-bold" style="height: 50px;" required>
                            <option value="" disabled selected>Select Senior Citizen</option>
                            {% for senior in seniors %}
                                <option value="{{ senior.id }}">{{ senior.fullname }} ({{ senior.email }})</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-group mb-4">
                        <label class="text-muted small font-weight-bold text-uppercase" style="letter-spacing: 1px;">Report Title</label>
                        <input type="text" name="title" class="form-control text-main font-weight-bold" style="height: 50px;" placeholder="e.g. Daily Health Summary" required>
                    </div>

                    <div class="form-group mb-5">
                        <label class="text-muted small font-weight-bold text-uppercase" style="letter-spacing: 1px;">Description</label>
                        <textarea name="description" class="form-control text-main font-weight-bold" rows="6" placeholder="Write report details here..." required></textarea>
                    </div>

                    <button type="submit" class="modern-btn btn-block py-3">
                        <i class="icon-check-circle mr-2"></i> Submit Report
                    </button>
                    <a href="{% url 'admin_dashboard' %}" class="btn btn-link btn-block text-muted font-weight-bold small mt-3">Cancel and Return</a>
                </form>
            </div>
        </div>
    </div>
</div>

<br><br>
{% include 'footer.html' %}
