<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snehasparsham | Register</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/modern_light.css' %}">
    <style>
        body {
            background: linear-gradient(rgba(240, 242, 245, 0.8), rgba(240, 242, 245, 0.8)), url('{% static 'images/medium-shot-senior-couple.jpg' %}');
            background-size: cover;
            background-position: center;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 40px 0;
        }

        /* Animated Background Gradients (Light) */
        body::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: var(--primary);
            filter: blur(200px);
            border-radius: 50%;
            top: -200px;
            left: -100px;
            opacity: 0.08;
            z-index: -1;
        }

        .register-container {
            width: 100%;
            max-width: 650px;
            padding: 20px;
        }

        .section-title {
            border-left: 3px solid var(--primary);
            padding-left: 15px;
            margin-bottom: 25px;
            color: var(--primary);
            font-weight: 700;
        }
    </style>
</head>
<body class="fade-in">

    <div class="register-container">
        <div class="glass-card p-5 shadow-lg">
            <div class="text-center mb-5">
                <h1 class="text-gradient font-weight-bold display-4 mb-2">Join Us</h1>
                <p class="text-muted font-weight-bold">Create your Snehasparsham account today.</p>
            </div>

            <form method="POST" enctype="multipart/form-data" class="modern-form">
                {% csrf_token %}

                <!-- Personal Info -->
                <h6 class="section-title text-uppercase mb-4">Personal Information</h6>
                <div class="form-group mb-3">
                    <input type="text" name="fullname" class="form-control text-main font-weight-bold" style="height: 50px;" placeholder="Full Name" required>
                </div>
                <div class="row g-3">
                    <div class="col-md-6 mb-3">
                        <input type="email" name="email" class="form-control text-main font-weight-bold" style="height: 50px;" placeholder="Email" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <input type="password" name="password" class="form-control text-main font-weight-bold" style="height: 50px;" placeholder="Password" required>
                    </div>
                </div>
                <div class="form-group mb-3">
                    <input type="text" name="phone" class="form-control text-main font-weight-bold" style="height: 50px;" placeholder="Phone Number">
                </div>
                <div class="form-group mb-4">
                    <textarea name="address" class="form-control text-main font-weight-bold" rows="2" placeholder="Residential Address"></textarea>
                </div>

                <!-- Physical Info -->
                <h6 class="section-title text-uppercase mb-4">Physical Details</h6>
                <div class="row g-3 mb-3">
                    <div class="col-md-4">
                        <input type="number" name="age" class="form-control text-main font-weight-bold" style="height: 50px;" placeholder="Age">
                    </div>
                    <div class="col-md-4">
                        <input type="text" name="weight" class="form-control text-main font-weight-bold" style="height: 50px;" placeholder="Weight">
                    </div>
                    <div class="col-md-4">
                        <input type="text" name="height" class="form-control text-main font-weight-bold" style="height: 50px;" placeholder="Height">
                    </div>
                </div>

                <div class="form-group mb-4">
                    <select name="blood_group" class="form-control text-main font-weight-bold" style="height: 50px;">
                        <option value="" class="bg-white">Select Blood Group</option>
                        <option class="bg-white">A+</option>
                        <option class="bg-white">A-</option>
                        <option class="bg-white">B+</option>
                        <option class="bg-white">B-</option>
                        <option class="bg-white">O+</option>
                        <option class="bg-white">O-</option>
                        <option class="bg-white">AB+</option>
                        <option class="bg-white">AB-</option>
                    </select>
                </div>

                <!-- Account Info -->
                <h6 class="section-title text-uppercase mb-4">Account Type</h6>
                <div class="form-group mb-3">
                    <select name="role" id="roleSelect" class="form-control text-main font-weight-bold" style="height: 50px;" required onchange="toggleExperienceField()">
                        <option value="" class="bg-white">Select Role</option>
                        <option value="senior" class="bg-white">Senior Citizen</option>
                        <option value="family" class="bg-white">Family Member</option>
                        <option value="caretaker" class="bg-white">Caretaker</option>
                    </select>
                </div>

                <!-- Caretaker Specific: Experience, Availability, Services -->
                <div id="caretakerFields" style="display: none;">
                    <div class="form-group mb-3">
                        <label class="text-muted small font-weight-bold mb-2">Years of Experience</label>
                        <input type="number" name="experience" class="form-control text-main font-weight-bold" style="height: 50px;" placeholder="Years of Experience" min="0">
                    </div>

                    <div class="form-group mb-4">
                        <label class="text-muted small font-weight-bold mb-2">Availability (Select all that apply)</label>
                        <div class="row px-3">
                            <div class="col-4 form-check">
                                <input class="form-check-input" type="checkbox" name="availability" value="Full Day" id="avail_full">
                                <label class="form-check-label small text-main font-weight-bold" for="avail_full">Full Day</label>
                            </div>
                            <div class="col-4 form-check">
                                <input class="form-check-input" type="checkbox" name="availability" value="Day" id="avail_day">
                                <label class="form-check-label small text-main font-weight-bold" for="avail_day">Day</label>
                            </div>
                            <div class="col-4 form-check">
                                <input class="form-check-input" type="checkbox" name="availability" value="Half Day" id="avail_half">
                                <label class="form-check-label small text-main font-weight-bold" for="avail_half">Half Day</label>
                            </div>
                        </div>
                    </div>

                    <div class="form-group mb-4">
                        <label class="text-muted small font-weight-bold mb-2">Services Offered</label>
                        <div class="row px-3">
                            <div class="col-6 mb-2 form-check">
                                <input class="form-check-input" type="checkbox" name="services" value="Health Monitoring" id="service1">
                                <label class="form-check-label small text-main" for="service1">Health Monitoring</label>
                            </div>
                            <div class="col-6 mb-2 form-check">
                                <input class="form-check-input" type="checkbox" name="services" value="Personal Care" id="service2">
                                <label class="form-check-label small text-main" for="service2">Personal Care</label>
                            </div>
                            <div class="col-6 mb-2 form-check">
                                <input class="form-check-input" type="checkbox" name="services" value="Medicine Tracking" id="service3">
                                <label class="form-check-label small text-main" for="service3">Medicine Tracking</label>
                            </div>
                            <div class="col-6 mb-2 form-check">
                                <input class="form-check-input" type="checkbox" name="services" value="Meal Preparation" id="service4">
                                <label class="form-check-label small text-main" for="service4">Meal Preparation</label>
                            </div>
                            <div class="col-12 mb-2 form-check">
                                <input class="form-check-input" type="checkbox" name="services" value="Mobility Assistance" id="service5">
                                <label class="form-check-label small text-main" for="service5">Mobility Assistance</label>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="form-group mb-5">
                    <label class="text-muted small font-weight-bold mb-2">Profile Picture</label>
                    <input type="file" name="profile" class="form-control text-main font-weight-bold" style="padding: 10px;">
                </div>

                <button type="submit" class="modern-btn btn-block py-3 mb-4">
                    Complete Registration
                </button>

                <p class="text-muted small text-center font-weight-bold">
                    Already have an account? <a href="{% url 'login' %}" class="text-primary font-weight-bold">Sign In</a>
                </p>
                
                <div class="text-center">
                    <a href="{% url 'home' %}" class="btn btn-link text-muted small font-weight-bold">Back to Home</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        function toggleExperienceField() {
            const roleSelect = document.getElementById('roleSelect');
            const caretakerFields = document.getElementById('caretakerFields');
            if (roleSelect.value === 'caretaker') {
                caretakerFields.style.display = 'block';
            } else {
                caretakerFields.style.display = 'none';
            }
        }
    </script>

    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
