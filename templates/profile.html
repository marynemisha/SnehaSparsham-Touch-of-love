{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Profile</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
    body {
        font-family: 'Poppins', sans-serif;
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f4f6f9;
        overflow: hidden;
    }

    .card {
        position: relative;
        background: #ffffff;
        border-radius: 25px;
        padding: 40px 30px;
        width: 350px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        transition: transform 0.3s, box-shadow 0.3s;
    }

    .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 15px 45px rgba(0,0,0,0.15);
    }

    .profile-pic {
        width: 160px;
        height: 160px;
        border-radius: 50%;
        object-fit: cover;
        border: 4px solid #0d9488;
        margin-bottom: 20px;
        box-shadow: 0 4px 15px rgba(78,115,223,0.3);
        transition: transform 0.3s;
    }

    .profile-pic:hover {
        transform: scale(1.05);
    }

    .name {
        font-size: 26px;
        font-weight: 600;
        color: #2c3e50;
        margin-bottom: 10px;
    }

    .email {
        font-size: 16px;
        color: #7f8c8d;
        margin-bottom: 25px;
        word-break: break-word;
    }

    .btn {
        display: inline-block;
        padding: 12px 28px;
        font-size: 16px;
        font-weight: 500;
        color: #ffffff;
        background: #0d9488;
        border-radius: 12px;
        text-decoration: none;
        box-shadow: 0 6px 18px rgba(78,115,223,0.3);
        transition: transform 0.3s, box-shadow 0.3s;
    }

    .btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 25px rgba(78,115,223,0.5);
    }

    @media (max-width: 400px) {
        .card {
            width: 90%;
            padding: 30px 20px;
        }
        .profile-pic {
            width: 130px;
            height: 130px;
        }
    }
</style>
</head>
<body>

<div class="card">
    {% if user.profile %}
        <img src="{{ user.profile.url }}" class="profile-pic" alt="Profile Picture">
    {% else %}
        <img src="https://via.placeholder.com/150" class="profile-pic" alt="No Image">
    {% endif %}

    <div class="name">{{ user.fullname }}</div>
    <div class="email">{{ user.email }}</div>
    <a href="{% url 'update_profile' %}" class="btn">Update Profile</a>
</div>

</body>
</html>
