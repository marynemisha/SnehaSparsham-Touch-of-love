<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snehasparsham | Login</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/modern_light.css' %}">
    <style>
        body {
            background: linear-gradient(rgba(240, 242, 245, 0.8), rgba(240, 242, 245, 0.8)), url('{% static 'images/medium-shot-senior-couple.jpg' %}');
            background-size: cover;
            background-position: center;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            overflow: hidden;
        }

        /* Animated Background Gradients (Light) */
        body::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: var(--primary);
            filter: blur(150px);
            border-radius: 50%;
            top: -100px;
            right: -100px;
            opacity: 0.1;
            z-index: -1;
        }

        body::after {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: var(--accent);
            filter: blur(180px);
            border-radius: 50%;
            bottom: -150px;
            left: -150px;
            opacity: 0.1;
            z-index: -1;
        }

        .login-container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }
    </style>
</head>
<body class="fade-in">

    <div class="login-container">
        <div class="glass-card text-center p-5">
            <div class="mb-4">
                <h1 class="text-gradient font-weight-bold display-4 mb-2">Login</h1>
                <p class="text-muted small font-weight-bold text-uppercase" style="letter-spacing: 2px;">Welcome Back</p>
            </div>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-danger bg-white border-danger text-danger small mb-4 shadow-sm" style="border-radius: 12px;">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST" class="modern-form">
                {% csrf_token %}

                <div class="form-group mb-4 text-start">
                    <label class="text-muted small font-weight-bold text-uppercase mb-2" style="letter-spacing: 1px;">Email Address</label>
                    <input type="email" name="email" class="form-control text-main font-weight-bold" style="height: 50px;" placeholder="name@example.com" required>
                </div>

                <div class="form-group mb-5 text-start">
                    <label class="text-muted small font-weight-bold text-uppercase mb-2" style="letter-spacing: 1px;">Password</label>
                    <input type="password" name="password" class="form-control text-main font-weight-bold" style="height: 50px;" placeholder="••••••••" required>
                </div>

                <button type="submit" class="modern-btn btn-block py-3 mb-4">
                    Sign In
                </button>

                <p class="text-muted small font-weight-bold">
                    Don't have an account? <a href="{% url 'register' %}" class="text-primary font-weight-bold">Join Snehasparsham</a>
                </p>
                
                <a href="{% url 'home' %}" class="btn btn-link btn-block text-muted small font-weight-bold mt-2">Back to Home</a>
            </form>
        </div>
    </div>

    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
